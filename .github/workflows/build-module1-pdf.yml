name: Build Module 1 PDF

on:
  push:
    branches:
      - module1-ultimate-handbook-2026-10-05

permissions:
  contents: write

jobs:
  build-pdf:
    if: !contains(github.event.head_commit.message, '[pdf-build]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout handbook branch
        uses: actions/checkout@v4
        with:
          ref: module1-ultimate-handbook-2026-10-05

      - name: Render HTML to PDF
        run: |
          mkdir -p dist
          chromium --headless --no-sandbox --disable-gpu --no-pdf-header-footer \
            --print-to-pdf=dist/CSE2101_Module1_Ultimate_Handbook.pdf \
            "file://$GITHUB_WORKSPACE/docs/module1/MODULE1_ULTIMATE_HANDBOOK_INSPIRED.html"

      - name: Commit PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs/module1
          cp dist/CSE2101_Module1_Ultimate_Handbook.pdf docs/module1/CSE2101_Module1_Ultimate_Handbook.pdf
          git add docs/module1/CSE2101_Module1_Ultimate_Handbook.pdf
          git commit -m "Build Module 1 handbook PDF [pdf-build]"
          git push origin module1-ultimate-handbook-2026-10-05
